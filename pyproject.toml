[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gmolai-retrain"
version = "0.3.0"
description = "Auditable molecular representation training, evaluation, and export pipeline"
requires-python = ">=3.12"
dependencies = [
  "duckdb==1.5.4",
  "numpy>=1.26",
  "pyarrow==19.0.1",
  "PyYAML==6.0.2",
  "rdkit==2025.9.3",
  "tqdm==4.67.1",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]
evaluation = ["pandas==2.2.3", "scikit-learn==1.5.0", "scipy==1.15.3"]

[project.scripts]
gmolai-retrain = "gmolai_retrain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
